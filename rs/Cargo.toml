[package]
name = "berean"
license = "AGPL-3.0-only"
version = "0.2.0"
edition = "2021"
default-run = "berean"

[[bin]]
name = "berean"
path = "src/main.rs"

[[bin]]
name = "berean-build-data"
path = "src/bin/build_data.rs"

[dependencies]
axum = { version = "0.8", features = ["macros", "json"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "trace", "set-header", "cors"] }
# SQLCipher: the user database is encrypted at rest when BEREAN_DB_KEY is set (see db::open_pool)
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "serde_json"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.8"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
# no "compression": it inflates the file into a fresh Vec on every get(), per request; embedded raw, the bytes are
# served straight from the binary's mapped pages (and most of dist/ is already .br)
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
regex = "1"
once_cell = "1"
brotli = "6"
# gzip for the offline ministry packs (the phone stores them, so not the response layer's brotli)
flate2 = "1"
axum-extra = { version = "0.10", features = ["cookie"] }
bytes = "1"
http = "1"
futures = "0.3"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
